[project]
name = "trader-bot"
version = "0.1.0"
requires-python = ">=3.11.14"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "rich>=15.0.0",
    "sqlmodel>=0.0.38",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
